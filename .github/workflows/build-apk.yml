name: Build Flet APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          working-directory: New folder/assets
          archive-output: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: New folder/assets/dist/*.apk